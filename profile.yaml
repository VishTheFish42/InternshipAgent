preferences:
  locations: ["United States"]
  remote_ok: true
  on_site_ok: true
  # Postings containing these words are always excluded:
  keywords_excluded: []

matching:
  # NOT a "good personal fit" bar (there isn't one — every real software/AI/data
  # posting gets an alert regardless of how weak the fit is, with its score and
  # missing qualifications so you judge for yourself). This only cuts postings
  # the AI scorer identified as flat-out the wrong field — some sources (e.g.
  # RemoteOK's "junior" tag) pull in non-software roles that the scoring prompt
  # pushes to 0-5. Raise this only if off-domain noise creeps back in.
  min_relevance_score: 15
  max_posting_age_days: 7  # skip postings older than this (by posted_at); postings with no
                           # reliable posted_at are kept
