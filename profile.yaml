preferences:
  locations: ["United States"]
  remote_ok: true
  on_site_ok: true
  # Postings containing these words are always excluded:
  keywords_excluded: []

matching:
  # No minimum score — every scored posting gets an alert with its score and
  # missing qualifications; you decide what's worth applying to.
  digest_enabled: true  # send a summary message every hour in addition to real-time alerts
  max_posting_age_days: 7  # skip postings older than this (by posted_at); postings with no
                           # reliable posted_at are kept
