# Alembic environment for the multi-tenant web app's schema (T-1102,
# src/web/db.py) — entirely separate from alembic.ini/alembic/, which manages
# the existing single-user worker's SQLite schema (src/db.py). Never point
# both configs at the same database; see docs/design.md §14.3 for why they're
# kept apart. Run with: alembic -c alembic_web.ini <command>

[alembic]
script_location = %(here)s/alembic_web
prepend_sys_path = .
path_separator = os

# URL is set programmatically in alembic_web/env.py from the SUPABASE_DB_URL
# env var. The value below is never used directly.
sqlalchemy.url = postgresql+psycopg://localhost/placeholder


[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
