# companies.example.yaml — template for your company watchlist
#
# Copy this file to companies.yaml (which is gitignored) and add your targets.
# You only need the company name — the agent discovers the career page automatically.
# If a company can't be found, it shows up in `python -m src.db stats` as unresolved.

companies:
  - Google
  - Stripe
  - OpenAI
  - Figma
  - Linear

# Optional. A subset of `companies` (or any name — it doesn't have to
# already be listed above) that you care about most. Unresolved/broken
# companies here are retried on a tighter cooldown (every few hours)
# instead of the default once-a-week cooldown everything else gets — so
# they get first claim on the search API's limited monthly quota rather
# than getting drowned out by a large watchlist. Leave empty or omit
# entirely if you don't need this.
priority_companies:
  - Google
